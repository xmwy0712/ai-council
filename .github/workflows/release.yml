name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows exe + zip + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (packaging extras)
        run: uv sync --extra packaging
      - name: Install Inno Setup
        shell: bash
        run: choco install innosetup -y --no-progress
      - name: Freeze one-file exe
        run: uv run python tools/build_exe.py
      - name: Freeze folder build
        run: uv run python tools/build_exe.py --onedir
      - name: Pack portable zip
        run: uv run python tools/build_exe.py --zip
      - name: Compile installer (ISCC)
        run: uv run python tools/build_installer.py --no-build
      - name: Smoke test the exe (fake adapters, no secrets)
        shell: bash
        run: |
          ./dist/ai-council.exe --help
          ./dist/ai-council.exe run "CI exe smoke" --data-dir ./dist/.smoke-data | tail -3
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-windows
          path: |
            dist/ai-council.exe
            dist/ai-council-win64.zip
            dist/AI-Council-Setup-*.exe

  publish:
    name: GitHub release
    needs: windows-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: uv build
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: ai-council-windows
          path: dist-exe
      - name: Generate release notes from CHANGELOG
        run: uv run python tools/release_notes.py "${{ github.ref_name }}" --out release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist-exe/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
