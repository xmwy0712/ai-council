[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-council"
dynamic = ["version"]
description = "Multi-vendor AI council: structured deliberation that converges on one executable plan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "llm", "council", "debate", "orchestration", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "keyring>=25,<27",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Freezing a standalone Windows exe is opt-in: pip install ".[packaging]"
packaging = [
  "pyinstaller>=6.10",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
council = "council.cli.main:app"

[project.urls]
Homepage = "https://github.com/xmwy0712/ai-council"
Issues = "https://github.com/xmwy0712/ai-council/issues"

[tool.hatch.build.targets.wheel]
packages = ["council"]
# council/web/static is inside the package tree, so hatchling ships it
# automatically — no force-include (that would double-add every asset).

[tool.hatch.build.targets.sdist]
include = ["council", "tests", "docs", "README.md", "LICENSE"]

[tool.hatch.version]
path = "council/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: marks tests as slow"]

[tool.coverage.run]
branch = true
source = ["council"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 100
# council.py is the frozen reference prototype this project replaces; it is kept
# for comparison only and is not part of the shipped package.
#
# NOTE: do not add a bare "web" here. `extend-exclude` matches directory names
# anywhere in the tree, so "web" silently excluded `council/web` — the module
# that carries the FastAPI app — from `ruff check` in CI, which passes no
# explicit path. Only `council/web/static` (plain JS/CSS) is worth excluding.
extend-exclude = [".venv", "build", "dist", "council.py", "council/web/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: typer option defaults are calls by design.
# RUF001-003: this is a zh-CN project; CJK punctuation is correct, not ambiguous.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["council/core", "council/adapters", "council/registry", "council/web"]
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["typer.*", "click.*", "rich.*", "fastapi.*", "starlette.*", "uvicorn.*", "multipart.*", "websockets.*", "anyio.*"]
ignore_missing_imports = true
