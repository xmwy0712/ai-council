# 硅基流动 SiliconFlow（OpenAI 兼容端点）
# 核实 2026-09-05：聚合 Qwen / DeepSeek / GLM / Kimi 等开源权重模型。
# 思考旋钮为标量 thinking_budget（部分模型需伴生 enable_thinking）。

[provider]
id = "siliconflow"
display = "硅基流动 SiliconFlow"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"
adapter = "openai_api"
docs = "https://docs.siliconflow.cn/cn/userguide/introduction"

[provider.thinking]
style = "thinking_budget"
param = "thinking_budget"

[provider.thinking.levels]
low = 512
medium = 4096
high = 16384

[[models]]
id = "Qwen/Qwen3.8-235B-A22B"
display = "Qwen3.8-235B-A22B"
thinking = true
max_context_tokens = 262144
max_output_tokens = 65536
verified = "2026-09-05"
source = "https://docs.siliconflow.cn/cn/userguide/introduction"

