# OpenRouter（OpenAI 兼容网关）
# 核实 2026-09-06：只收录在 OpenRouter 模型页直接核对过的 slug，
# 二手来源拼出的 slug 一律不写进来。
# 网关的思考旋钮是嵌套对象 reasoning:{effort} —— 旋钮只支持标量，
# 因此逐模型声明 thinking_style = "none"，不做档位翻译。

[provider]
id = "openrouter"
display = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
secret_env = "OPENROUTER_API_KEY"
adapter = "openai_api"
docs = "https://openrouter.ai/models"

[[models]]
id = "openai/gpt-6-astra"
display = "OpenAI GPT-6 Astra (OR)"
thinking = true
max_context_tokens = 400000
max_output_tokens = 128000
thinking_style = "none"
verified = "2026-09-05"
source = "https://openrouter.ai/models"

