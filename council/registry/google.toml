# Google Gemini（generativelanguage API）。
# 注意：Gemini 3+ 用 thinkingLevel（枚举），Gemini 2.5 用 thinkingBudget（整数），
# 两代参数混用会报错——model 条目里的 thinking_style 覆盖是数据，不是代码分支。
# 参数核实见 docs/PROVIDERS.md（2026-09-06）。
# 世代事实（官方模型页 + Google Antigravity 博客交叉印证）：Flash 线已到 3.8
# （2026-09-02 发布，3.7 仍全面支持）；Pro 线旗舰仍是 3.1 Pro（Preview），
# 不存在 gemini-3.7-pro / gemini-3.6-pro。Gemini 3.8 Flash Cyber 为受限访问，未收录。

[provider]
id = "google_api"
display = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com"
secret_env = "GOOGLE_API_KEY"
docs = "https://developers.generativeai.google/api/generate-content"

[provider.thinking]
style = "thinking_level"
param = "thinkingLevel"

# Gemini 3 Flash 支持 4 档（MINIMAL 起）；Pro / 3.1 Pro 无 MINIMAL（逐模型覆盖）
[provider.thinking.levels]
low = "LOW"
medium = "MEDIUM"
high = "HIGH"

[[models]]
id = "gemini-3.8-flash"
thinking_style = "thinking_level"
param = "thinkingLevel"
levels = { minimal = "MINIMAL", low = "LOW", medium = "MEDIUM", high = "HIGH" }
display = "Gemini 3.8 Flash"
thinking = true
structured_output = true
streaming = true
max_context_tokens = 1048576
max_output_tokens = 65536
verified = "2026-09-06"
source = "https://antigravity.google/blog/gemini-3-8-flash-in-google-antigravity"

