# 智谱 GLM（OpenAI 兼容端点）
# 核实 2026-09-06：GLM-5.3（08-14，后训练强化，思考不可关闭，档位 low/high/max）
# 与 GLM-5.3-Flash（08-26，320B-A18B 原生多模态、1M 上下文、MIT 开源）在役。
# GLM 的思考开关是嵌套对象 thinking:{type} —— 旋钮不支持嵌套，
# 因此逐模型声明 thinking_style = "none"，交由服务端默认行为处理。

[provider]
id = "zhipu"
display = "智谱 GLM"
base_url = "https://open.bigmodel.cn/api/paas/v4"
secret_env = "ZHIPU_API_KEY"
adapter = "openai_api"
docs = "https://docs.bigmodel.cn/cn/guide/develop/http/usage"

[[models]]
id = "glm-5.3"
display = "GLM-5.3"
thinking = true
max_context_tokens = 205000
max_output_tokens = 128000
thinking_style = "none"
verified = "2026-09-06"
source = "https://docs.bigmodel.cn/cn/guide/models/"

[[models]]
id = "glm-5.3-flash"
display = "GLM-5.3 Flash"
thinking = true
max_context_tokens = 1000000
