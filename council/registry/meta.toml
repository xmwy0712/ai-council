# Meta Model API（OpenAI 兼容端点）
# 核实 2026-09-06：Meta 已将开发者端点从 api.llama.com 迁移到
# https://api.meta.ai/v1，密钥环境变量为 MODEL_API_KEY（不再是 LLAMA_API_KEY）。
# Muse Spark 1.1/1.2/1.3 推理常开，支持 5 档 reasoning_effort：
# minimal / low / medium / high / xhigh（默认 medium，无 max 档）。

[provider]
id = "meta"
display = "Meta Model API"
base_url = "https://api.meta.ai/v1"
secret_env = "MODEL_API_KEY"
adapter = "openai_api"
docs = "https://dev.meta.ai"

[[models]]
id = "muse-spark-1.3"
display = "Muse Spark 1.3"
thinking = true
thinking_style = "enum_effort"
param = "reasoning_effort"
levels = { minimal = "minimal", low = "low", medium = "medium", high = "high", xhigh = "xhigh" }
max_context_tokens = 131072
max_output_tokens = 32768
verified = "2026-09-05"
source = "https://dev.meta.ai"

