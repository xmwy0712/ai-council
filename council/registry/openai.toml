# OpenAI 及任意 OpenAI 兼容端点。
# 参数名与取值范围见 docs/PROVIDERS.md（核实 2026-09-06）。
# GPT-6 家族（2026-09-03 发布）仅 gpt-6-astra 一个成员；5.6 世代在役。
# 核实补充：二手价格页仍列 gpt-5.2-chat-latest，官方未证实，继续不收录。

[provider]
id = "openai_api"
display = "OpenAI"
base_url = "https://api.openai.com/v1"
secret_env = "OPENAI_API_KEY"
docs = "https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create"

[provider.thinking]
style = "enum_effort"
param = "reasoning_effort"

[provider.thinking.levels]
none = "none"
low = "low"
medium = "medium"
high = "high"

[[models]]
id = "gpt-6-astra"
display = "GPT-6 Astra"
thinking_style = "enum_effort"
param = "reasoning_effort"
levels = { low = "low", medium = "medium", high = "high", xhigh = "xhigh", max = "max" }
thinking = true
omit_temperature = true
structured_output = true
streaming = true
max_context_tokens = 1050000
max_output_tokens = 128000
verified = "2026-09-06"
source = "https://openai.com/index/gpt-6-astra/"

[[models]]
id = "gpt-5.6-sol"
thinking_style = "enum_effort"
param = "reasoning_effort"
levels = { none = "none", low = "low", medium = "medium", high = "high", xhigh = "xhigh" }
display = "GPT-5.6 Sol"
thinking = true
omit_temperature = true
structured_output = true
streaming = true
max_context_tokens = 400000
max_output_tokens = 128000
verified = "2026-09-06"
source = "https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create"

