# OpenAI 及任意 OpenAI 兼容端点。
# 参数名与取值范围见 docs/PROVIDERS.md（核实 2026-09-06）。
# GPT-6 / GPT-5.6 世代在役；gpt-5.2-chat-latest 已关闭下线。

[provider]
id = "openai_api"
display = "OpenAI"
base_url = "https://api.openai.com/v1"
secret_env = "OPENAI_API_KEY"
docs = "https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create"

[provider.thinking]
style = "enum_effort"
param = "reasoning_effort"

[provider.thinking.levels]
low = "low"
medium = "medium"
high = "high"

[[models]]
id = "gpt-6-astra"
display = "GPT-6 Astra"
thinking = true
structured_output = true
streaming = true
max_context_tokens = 400000
max_output_tokens = 128000
verified = "2026-09-06"
source = "https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create"

