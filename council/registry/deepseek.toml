# DeepSeek（OpenAI 兼容端点）
# 核实 2026-09-15（官方文档 api-docs.deepseek.com 与 /v1/models 实测）：
#   2026-09-10 发布 DeepSeek-V4.1-Flash，API 模型名改为 `deepseek-flash`；
#   旧的 deepseek-v4-flash 与 deepseek-v4-flash-vision-exp 已下线，
#   出于兼容被暂时路由到 V4.1 Flash。真实 /v1/models 只返回两个 id：
#     deepseek-flash      版本 DeepSeek-V4.1-Flash（原生多模态）
#     deepseek-v4-pro     版本 DeepSeek-V4-Pro-0813（继续提供）
# 思考：嵌入 thinking:{type} 可开关 + 标量 reasoning_effort。
#   官方档位 low / high(默认) / max；映射表 minimal→low、medium→high、
#   xhigh→high、ultra→max，故只声明可精确表达的三档。
# 思考模式不支持 temperature / presence_penalty / frequency_penalty（传了也不生效）。

[provider]
id = "deepseek"
display = "DeepSeek"
base_url = "https://api.deepseek.com/v1"
secret_env = "DEEPSEEK_API_KEY"
adapter = "openai_api"
docs = "https://api-docs.deepseek.com/quick_start/pricing"

[provider.thinking]
style = "enum_effort"
param = "reasoning_effort"

# 官方推理强度：low / high(默认) / max —— 无 medium 档
[provider.thinking.levels]
low = "low"
high = "high"
max = "max"

[[models]]
id = "deepseek-flash"
display = "DeepSeek V4.1 Flash"
thinking = true
max_context_tokens = 1048576
max_output_tokens = 393216
verified = "2026-09-15"
source = "https://api-docs.deepseek.com/zh-cn/updates"

[[models]]
id = "deepseek-v4-pro"
display = "DeepSeek V4 Pro（0813）"
thinking = true
max_context_tokens = 1048576
max_output_tokens = 393216
verified = "2026-09-15"
source = "https://api-docs.deepseek.com/zh-cn/updates"
