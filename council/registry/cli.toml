# 本地 CLI 登录态会话（cli_session）。
# 安全参数（只读/禁工具/非交互）固定在代码里，绝不由本文件控制——
# 每家 CLI 只收录一条「订阅默认模型」：模型 id 冒号后留空即不向 CLI 传
# --model，由用户在 CLI 内部自行切换模型与思考档位，网页端不再罗列。

[provider]
id = "cli_session"
display = "本地 CLI 会话"
docs = "docs/PROVIDERS.md"

[provider.thinking]
style = "none"

[[models]]
id = "codex:"
profile = "codex"
display = "Codex CLI（订阅默认模型）"
thinking = false
structured_output = false
streaming = false
verified = "2026-09-06"
source = "https://developers.openai.com/codex/cli"

[[models]]
id = "claude:"
profile = "claude"
display = "Claude Code（订阅默认模型）"
thinking = false
structured_output = true
streaming = false
verified = "2026-09-06"
source = "https://code.claude.com/docs/ja/headless"

[[models]]
id = "agy:"
profile = "agy"
display = "Antigravity CLI（订阅默认模型）"
thinking = false
structured_output = true
streaming = false
verified = "2026-09-06"
source = "https://codelabs.developers.google.cn/antigravity-cli-hands-on"
