<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI Council</title>
  <!-- Three participants, the product's own ceiling. Declaring it also stops
       browsers from guessing /favicon.ico and taking a 404 on every load. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1.3.0.1">
  <link rel="stylesheet" href="style.css?v=1.3.0.1">
  <script>
    // Apply the persisted theme before first paint to avoid flashing.
    // Colors are set as inline CSS variables; mode/id attributes let the
    // stylesheet adapt (dark accents, high-contrast opt-outs) without JS.
    try {
      var saved = JSON.parse(localStorage.getItem("council:theme") || "null");
      if (saved) {
        var mode = saved.mode || "light";
        document.documentElement.dataset.themeMode = mode;
        if (saved.id) document.documentElement.dataset.themeId = saved.id;
        if (saved.colors) {
          var root = document.documentElement.style;
          Object.keys(saved.colors).forEach(function (key) {
            root.setProperty(key, saved.colors[key]);
          });
        }
      }
    } catch (err) { /* corrupt saved theme: fall back to CSS defaults */ }
  </script>
</head>
<body>
  <!-- Ambient scene: soft aurora + grain, purely decorative -->
  <div class="scene" aria-hidden="true">
    <div class="scene-glow scene-glow--a"></div>
    <div class="scene-glow scene-glow--b"></div>
    <div class="scene-glow scene-glow--c"></div>
    <div class="scene-grain"></div>

        </button>

        </div>
      </div>
    </section>

    <!-- ====================== 新会谈 ====================== -->
    <section id="view-new" class="view hidden">
      <div class="card start-card page-card">
        <p class="kicker" data-i18n="new.eyebrow"></p>
        <h2 data-i18n="new.title"></h2>
        <div id="roster-editor" class="roster-editor" aria-label="roster"></div>
        <form id="new-form">
          <label data-i18n="new.question" for="question"></label>
          <textarea id="question" rows="4" placeholder="…"></textarea>
          <div class="row-between">
            <label class="file-label chip" for="files" data-i18n="new.files"></label>
            <input id="files" type="file" multiple class="hidden"
                   accept=".txt,.md,.json,.csv,text/plain,text/markdown,application/json,text/csv">
          </div>
          <ul id="file-list" class="file-list"></ul>
          <p class="hint" data-i18n="new.hint"></p>
          <div id="new-error" class="banner error hidden"></div>
          <button id="btn-start" class="primary" type="submit" data-i18n="new.start"></button>
        </form>
      </div>
    </section>

    <!-- ====================== 历史对话 ====================== -->
    <section id="view-history" class="view hidden">
      <!-- 两张独立的卡在流内竖向堆叠，永不重叠 -->
      <div class="stack">
        <div class="card page-card">
          <div class="row-between">
            <h2 data-i18n="list.title"></h2>
            <span class="help-tip" data-i18n-tip="list.help" tabindex="0">?</span>
          </div>
          <div id="session-list" class="session-list"><p class="dim" data-i18n="list.empty"></p></div>
        </div>

        <!-- 检索：按会议主题与会议时间筛选，置于列表下方 -->
        <div class="card page-card search-card">
          <h2 data-i18n="search.title"></h2>
          <div class="search-grid">
            <input id="search-topic" class="search-topic" type="search" autocomplete="off"
                   data-i18n-ph="search.topic.ph">
            <label class="search-date">
              <span data-i18n="search.from"></span>
              <input id="search-from" type="date">
            </label>
            <label class="search-date">
              <span data-i18n="search.to"></span>
              <input id="search-to" type="date">
            </label>
            <button id="search-clear" class="chip" type="button" data-i18n="search.clear"></button>
          </div>
          <p id="search-summary" class="hint"></p>
        </div>
      </div>
    </section>

    <!-- ====================== 设置 ====================== -->
    <section id="view-settings" class="view hidden">
      <div class="card page-card settings-page">
        <h2 data-i18n="settings.open"></h2>

        <details class="settings-group" open>
          <summary><span data-i18n="settings.group.general"></span></summary>
          <div class="group-body">
            <section class="settings-section">
              <div class="settings-row">
                <!-- 明暗与语言已上移到右上角的分段开关 -->
                <label class="chip toggle-chip" for="fx-toggle">
                  <input id="fx-toggle" type="checkbox">
                  <span data-i18n="settings.fx.enable"></span>
                </label>
              </div>
              <div class="settings-row">
                <label class="chip toggle-chip" for="raw-toggle">
                  <input id="raw-toggle" type="checkbox">
                  <span data-i18n="settings.raw.enable"></span>
                </label>
                <span class="help-tip" data-i18n-tip="raw.help" tabindex="0">?</span>
              </div>
            </section>
          </div>
        </details>

        <details class="settings-group" open>
          <summary><span data-i18n="keys.title"></span></summary>
          <div class="group-body">
            <section class="settings-section">
              <p class="hint" data-i18n="keys.desc"></p>
              <div id="keys-list"></div>
              <div id="keys-error" class="banner error hidden" role="alert"></div>
              <div class="keys-custom">
                <input id="keys-custom-name" type="text" autocomplete="off" spellcheck="false">
                <input id="keys-custom-value" type="password" autocomplete="new-password" placeholder="sk-…">
                <button id="btn-keys-custom" class="chip" type="button" data-i18n="keys.custom.add"></button>
              </div>
            </section>
          </div>
        </details>

        <details class="settings-group">
          <summary><span data-i18n="settings.group.models"></span></summary>
          <div class="group-body">
            <details class="settings-group sub">
              <summary><span data-i18n="updates.title"></span>
                <span class="help-tip" data-i18n-tip="updates.help" tabindex="0">?</span>
              </summary>
              <div class="group-body">
                <section class="settings-section">
                  <div class="settings-row">
                    <label class="chip toggle-chip" for="updates-toggle">
                      <input id="updates-toggle" type="checkbox">
                      <span data-i18n="updates.enable"></span>
                    </label>
                    <button id="btn-updates-refresh" class="chip" type="button" data-i18n="updates.refresh"></button>
                  </div>
                  <p id="updates-status" class="hint"></p>
                  <details class="settings-group sub">
                    <summary><span data-i18n="updates.results"></span></summary>
                    <div class="group-body">
                      <div id="updates-list" class="diag-list"></div>
                    </div>
                  </details>
                </section>
              </div>
            </details>

            <details class="settings-group sub">
              <summary><span data-i18n="diag.title"></span></summary>
              <div class="group-body">
                <section class="settings-section">
                  <div class="settings-row">
                    <button id="btn-diagnostics" class="chip" type="button" data-i18n="diag.run"></button>
                  </div>
                  <div id="diag-list" class="diag-list"></div>
                </section>
              </div>
            </details>
          </div>
        </details>

        <details class="settings-group">
          <summary><span data-i18n="tune.title"></span></summary>
          <div class="group-body">
            <section class="settings-section">
              <div class="tune-grid">
                <label class="tune-item"><span data-i18n="tune.idle"></span><input id="tune-idle" type="number" min="10" max="3600" value="90"></label>
                <label class="tune-item"><span data-i18n="tune.retries"></span><input id="tune-retries" type="number" min="0" max="10" value="3"></label>
                <label class="tune-item">
                  <span class="tune-label">
                    <span data-i18n="tune.policy"></span>
                    <span class="help-tip" data-i18n-tip="policy.help" tabindex="0">?</span>
                  </span>
                  <span class="select-wrap">
                    <select id="tune-policy"></select>
                  </span>
                </label>
              </div>
              <p class="hint" data-i18n="tune.hint"></p>
            </section>
          </div>
        </details>
      </div>
    </section>

    <!-- ====================== session view ====================== -->
    <section id="view-session" class="view hidden">
      <div id="session-banner" class="banner error hidden"></div>

      <div class="card session-head">
        <div class="head-main">
          <h2 id="session-question" class="ellipsis"></h2>
          <div class="row gap">
            <span id="status-chip" class="status running" data-status="starting"></span>
            <span id="phase-chip" class="chip"></span>
            <span id="room-chip" class="chip"></span>
          </div>
          <p id="roster" class="hint"></p>
        </div>
        <div class="head-actions">
          <button id="btn-pause" class="chip" type="button" data-i18n="act.pause"></button>
          <button id="btn-resume" class="chip" type="button" data-i18n="act.resume"></button>
          <button id="btn-stop" class="chip danger" type="button" data-i18n="act.stop"></button>
          <!-- 失败策略与导出格式已移到「设置」：策略是新会谈的默认值，
               导出格式属于偏好设置，都不该占着会谈页的操作位 -->
          <span id="raw-chip" class="chip static" data-i18n-tip="raw.help"></span>
          <a id="btn-export" class="chip linklike" download data-i18n="act.export"></a>
        </div>
      </div>

      <div class="layout">
        <div class="card digest">
          <h3 data-i18n="session.proposal"></h3>
          <div id="digest-proposal" class="proposal"><p class="dim" data-i18n="session.waiting"></p></div>
          <div id="digest-extra"></div>
          <div class="meta-row" id="meta-row"></div>
        </div>
        <div class="card timeline-card">
          <h3 data-i18n="session.timeline"></h3>
          <ol id="timeline" class="timeline"></ol>
        </div>
      </div>
    </section>
  </main>

  <!-- ====================== intervention modal ====================== -->
  <div id="ask-overlay" class="overlay hidden">
    <div class="card ask-card">
      <h3 id="ask-title"></h3>
      <p id="ask-detail" class="prewrap dim"></p>
      <div id="ask-body"></div>
      <div id="ask-error" class="banner error hidden"></div>
    </div>
  </div>

  <!-- ====================== settings panel ====================== -->
  <!-- 按类分组、默认折叠：密钥最常用所以展开，其余收起，避免一屏塞满 -->

  <footer><span data-i18n="footer"></span></footer>
  <script src="app.js?v=1.3.0.1"></script>
</body>
</html>
